[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install && node scripts/embed-seed.mjs"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/data/jobs.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
